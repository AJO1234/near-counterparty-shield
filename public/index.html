<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counterparty Shield</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#5d6672; --line:#e3e6ea;
          --allow:#137a3f; --warn:#a15c00; --block:#b3261e; --accent:#1f5eff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a20; --ink:#e8eaed; --muted:#9aa3ad; --line:#2a2f37;
            --allow:#4cc37a; --warn:#f0a43a; --block:#ff6b61; --accent:#6f9bff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  form { display:grid; grid-template-columns: 1fr 120px auto; gap:8px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border:1px solid var(--line); background: var(--card); color: var(--ink); min-width:0; }
  button { background: var(--accent); color:#fff; border:0; cursor:pointer; font-weight:600; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr 1fr; } form input:first-child { grid-column: 1 / -1; } }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 20px; }
  .verdict { font-size: 28px; font-weight: 800; letter-spacing: .02em; }
  .ALLOW { color: var(--allow); } .WARN { color: var(--warn); } .BLOCK { color: var(--block); }
  ul { padding-left: 20px; margin: 8px 0; }
  li { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
  details summary { cursor: pointer; color: var(--muted); }
  .try { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:12px; }
  .try button { background: var(--card); color: var(--ink); border:1px solid var(--line); font-weight:500; font-size:13px; padding:6px 10px; }
  .foot { margin-top: 28px; }
  a { color: var(--accent); }
  pre { overflow:auto; font-size: 12px; background: var(--bg); padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Counterparty Shield</h1>
  <p class="sub">Check a NEAR account before an agent pays it. You get <b>allow</b>, <b>warn</b> or <b>block</b>, with the reasons.</p>
  <form id="f">
    <input id="receiver" placeholder="receiver, e.g. v2.ref-finance.near" required autocomplete="off" spellcheck="false">
    <input id="amount" placeholder="NEAR" inputmode="decimal">
    <button>Check</button>
  </form>
  <div class="try">
    <span class="muted">Try:</span>
    <button type="button" data-r="wrap.near">wrap.near</button>
    <button type="button" data-r="ref-finance-v2.near" data-a="10">ref-finance-v2.near · 10 NEAR</button>
    <button type="button" data-r="wrap.near.claims.near">wrap.near.claims.near</button>
    <button type="button" data-r="intents.near">intents.near</button>
    <button type="button" data-r="dex.intear.near" data-a="10">dex.intear.near · 10 NEAR</button>
  </div>
  <div id="out"></div>
  <p class="muted foot">Live NEAR mainnet data. Source, vault contract and attack demo: <a href="https://github.com/AJO1234/near-counterparty-shield">github.com/AJO1234/near-counterparty-shield</a></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
document.querySelectorAll('.try button').forEach((b) => b.addEventListener('click', () => {
  $('receiver').value = b.dataset.r;
  $('amount').value = b.dataset.a || '';
  $('f').requestSubmit();
}));
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = new URLSearchParams({ receiver: $('receiver').value.trim() });
  if ($('amount').value) q.set('amount', $('amount').value);
  $('out').innerHTML = '<div class="card muted">Checking on-chain…</div>';
  try {
    // Relative URL, so the page also works when served under a path like /shield/.
    const r = await (await fetch('v1/check?' + q)).json();
    if (r.error) throw new Error(r.error);
    const list = (xs, sign) => xs.length ? '<ul>' + xs.map((x) => `<li>${sign} ${esc(x)}</li>`).join('') + '</ul>' : '';
    $('out').innerHTML = `<div class="card">
      <div class="verdict ${r.verdict}">${r.verdict}</div>
      <div class="muted"><code>${esc(r.receiver)}</code> · ${esc(r.network)} · risk score ${r.score ?? 'n/a'}</div>
      ${list(r.reasons, '⚠')}${list(r.reassurance, '✓')}
      ${r.unavailable.length ? '<p class="muted">Not checked: ' + r.unavailable.map((u) => esc(u.label + ' (' + u.reason + ')')).join('; ') + '</p>' : ''}
      <details><summary>All signals (JSON)</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>
    </div>`;
  } catch (err) {
    $('out').innerHTML = `<div class="card BLOCK">${esc(err.message)}</div>`;
  }
});
</script>
</body>
</html>
